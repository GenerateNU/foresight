name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Shared conventional-commit type list. Referenced by both pr-lint and
# commit-lint so the allowed types stay in sync in one place.
# Note: .pre-commit-config.yaml keeps its own copy (different config format);
# keep the two in sync when adding or removing a type.
env:
  COMMIT_TYPES: |-
    feat
    fix
    docs
    style
    refactor
    perf
    test
    build
    ci
    chore
    revert

jobs:
  pr-lint:
    name: PR Title Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ env.COMMIT_TYPES }}

  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full PR history so we can validate every commit in the range.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install conventional-pre-commit
        run: pip install "conventional-pre-commit==4.1.0"

      - name: Check each commit message
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0
          # Validate every commit introduced by the PR (excludes merge commits).
          # $COMMIT_TYPES is newline-separated at the workflow level; unquoted
          # expansion here word-splits it into individual args for the tool.
          for sha in $(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA"); do
            msg_file="$(mktemp)"
            git log -1 --format=%B "$sha" > "$msg_file"
            echo "::group::$(git log -1 --format='%h %s' "$sha")"
            if conventional-pre-commit $COMMIT_TYPES "$msg_file"; then
              echo "OK"
            else
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  format:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check src/

      - name: Ruff format check
        run: uv run ruff format --check src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foresight
          POSTGRES_PASSWORD: foresight
          POSTGRES_DB: foresight_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foresight -d foresight_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://foresight:foresight@localhost:5432/foresight_db
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest -q
