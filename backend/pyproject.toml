[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foresight"
version = "0.1.0"
description = "AI revenue intelligence platform for boutique hotels"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.15",
    "asyncpg>=0.30",
    "pydantic-settings>=2.9",
    "python-dotenv>=1.1",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    # Pinned to match .pre-commit-config.yaml so local, pre-commit, and CI all
    # run the identical ruff version. Bump both together (e.g. via
    # `just pre-commit-update`) to avoid rule drift.
    "ruff==0.16.9",
    "pre-commit>=4.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]
ml = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/foresight"]

[tool.ruff]
target-version = "py312"
src = ["src"]
exclude = ["src/foresight/database/migrations"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]

[tool.ruff.lint.isort]
known-first-party = ["foresight"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
