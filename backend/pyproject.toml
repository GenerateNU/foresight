[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foresight"
version = "0.1.0"
description = "AI revenue intelligence platform for boutique hotels"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.15",
    "asyncpg>=0.30",
    "pydantic-settings>=2.9",
    "scalar-fastapi>=1.4",
    "python-dotenv>=1.1",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "scikit-learn>=1.9.1",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "interpret-core>=0.7.8",
    "numpy>=2.0",
    "joblib>=1.4",
    "authlib>=1.6",
    "itsdangerous>=2.2",
    "psutil>=7.0",
    "holidays>=0.109",
]

[dependency-groups]
dev = [
    # Pinned to match .pre-commit-config.yaml so local, pre-commit, and CI all
    # run the identical ruff version. Bump both together (e.g. via
    # `just pre-commit-update`) to avoid rule drift.
    "ruff==0.16.9",
    "pre-commit>=4.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "matplotlib>=3.11.2",
]

[tool.hatch.build.targets.wheel]
packages = ["foresight"]

[tool.ruff]
target-version = "py312"
src = ["."]
exclude = ["foresight/database/migrations"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "D",   # pydocstyle
    "ANN", # flake8-annotations
]
# Modules and packages don't need docstrings; `Any` is allowed where a value
# really can be anything.
ignore = ["D100", "D104", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# Endpoint docstrings put Args/Returns after a form feed (\f), which FastAPI
# cuts from /docs.
"foresight/routes/*" = ["D301"]
# Research scripts, not the app: no docstring or annotation rules.
"experiments/*" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["foresight"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
