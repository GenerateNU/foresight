[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foresight"
version = "0.1.0"
description = "AI revenue intelligence platform for boutique hotels"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.15",
    "asyncpg>=0.30",
    "pydantic-settings>=2.9",
    "scalar-fastapi>=1.4",
    "python-dotenv>=1.1",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "scikit-learn>=1.9.1",
    "httpx>=0.28",
    "openmeteo-requests>=1.7.5",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "interpret-core>=0.7.8",
    "numpy>=2.0",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    # Pinned to match .pre-commit-config.yaml so local, pre-commit, and CI all
    # run the identical ruff version. Bump both together (e.g. via
    # `just pre-commit-update`) to avoid rule drift.
    "ruff==0.16.9",
    "pre-commit>=4.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["foresight"]

[tool.ruff]
target-version = "py312"
src = ["."]
exclude = ["foresight/database/migrations"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]

[tool.ruff.lint.isort]
known-first-party = ["foresight"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "scripts"]
