# Overlay that points the stack at Neon instead of the local `db` container.
# Used by `just <recipe> --neon`; don't run it by hand unless you mean to:
#   docker compose -f docker-compose.yml -f docker-compose.neon.yml up -d
#
# The URLs come from the root .env, written by `neon deploy` / `neon env pull`
# (Compose reads .env for ${...} interpolation). The app's config.py converts
# them for asyncpg. See docs/decisions/0027-neon-postgres.md.

x-neon-env: &neon-env
  # Pooled (-pooler) URL for app traffic.
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL missing from .env; run `neon env pull`}
  # Direct URL; Alembic must bypass Neon's transaction-mode pooler.
  DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:?DATABASE_URL_UNPOOLED missing from .env; run `neon env pull`}

services:
  # The local Postgres isn't needed; only start it if the `local` profile is on.
  db:
    profiles: ["local"]

  migrate:
    environment: *neon-env
    depends_on: !reset {}

  backend:
    environment: *neon-env
    depends_on: !override
      migrate:
        condition: service_completed_successfully
